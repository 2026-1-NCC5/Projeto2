<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Camera AI</title>
  <style>
    :root { --primary: #FF6B00; --primary-dark: #e05a00; --green: #2E7D32; --red: #c62828; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FF6B00 0%, #ff9a4d 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 40px 36px;
      width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo .icon { font-size: 48px; display: block; margin-bottom: 8px; }
    .logo h1 { font-size: 22px; font-weight: 800; color: var(--primary); }
    .logo p { font-size: 13px; color: #888; margin-top: 4px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px; margin-top: 16px; }
    input {
      width: 100%; border: 1.5px solid #e0e0e0; border-radius: 10px;
      padding: 11px 14px; font-size: 14px; outline: none; transition: border-color .2s;
    }
    input:focus { border-color: var(--primary); }
    button {
      margin-top: 24px; width: 100%; background: var(--primary); color: #fff;
      border: none; border-radius: 10px; padding: 13px; font-size: 15px;
      font-weight: 700; cursor: pointer; transition: background .2s;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: .6; cursor: default; }
    .msg { border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 14px; display: none; }
    .msg.err { background: #ffebee; color: var(--red); display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="icon">📷</span>
      <h1>Camera AI</h1>
      <p>Lideranças Empáticas</p>
    </div>
    <form id="form">
      <label>Email</label>
      <input type="email" id="email" placeholder="admin@admin.com" required autofocus/>
      <label>Senha</label>
      <input type="password" id="password" placeholder="••••••" required/>
      <button type="submit" id="btn">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      btn.disabled = true; btn.textContent = 'Entrando...';
      const r = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await r.json();
      if (r.ok && data.ok) {
        window.location.href = '/';
      } else {
        msg.className = 'msg err';
        msg.textContent = '✗ ' + (data.detail || 'Credenciais inválidas');
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
