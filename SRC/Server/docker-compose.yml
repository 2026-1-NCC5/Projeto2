services:
  db:
    image: postgres:15
    container_name: liderancas_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: liderancas_backend
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    networks:
      - appnet

  dashboard:
    build: ../Dashboard
    container_name: liderancas_dashboard
    restart: always
    env_file:
      - ../Dashboard/.env
    environment:
      - SERVER_URL=http://liderancas_backend:8000
    volumes:
      - ../Dashboard:/app
    ports:
      - "8050:8050"
    networks:
      - appnet
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  appnet:
